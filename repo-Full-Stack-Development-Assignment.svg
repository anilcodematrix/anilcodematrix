<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img" aria-label="Full-Stack-Development-Assignment">
<title>Full-Stack-Development-Assignment</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d0221"/><stop offset="100%" stop-color="#160b33"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
</defs>
<style>
  .t { font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c084fc; }
  .l { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a3a3c2; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e2e8f0; }
  .big { font: 800 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e2e8f0; }
  .s { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a3a3c2; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  
</style>
<rect x=".5" y=".5" rx="12" width="399" height="149" fill="url(#bg)" stroke="#3b1a6e"/>
<rect x="24" y="50" width="48" height="3" rx="1.5" fill="url(#accent)"/>
<text x="24" y="38" class="t">Full-Stack-Development-Assignment</text>
<text x="24" y="80" class="l">Full-stack web development projects: HTML, CSS,</text>
<text x="24" y="99" class="l">JavaScript, PHP &amp; MySQL assignments with CRUD apps...</text>
<circle cx="30" cy="128" r="6" fill="#663399"/><text x="42" y="132" class="s" style="fill:#e2e8f0">CSS</text>
<text x="200" y="132" class="s">&#9733; 0</text><text x="250" y="132" class="s">&#9906; 0</text>
</svg>